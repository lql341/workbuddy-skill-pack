name: Release workbuddy-skill-pack

on:
  workflow_run:
    workflows: ["Validate skill"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-workbuddy-skill-pack
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify main is current and metadata agrees
        id: preflight
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit exists; its validation run will publish the release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tests/test-release.py
          echo "should-release=true" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.preflight.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "${tag} is already published"
            exit 0
          fi
          git fetch origin --tags
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          args=(release create "$tag" --verify-tag --title "workbuddy-skill-pack ${tag}" --notes-file RELEASE_HIGHLIGHTS.md)
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Attach the skill package
        if: steps.preflight.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          gh release view "$tag" >/dev/null 2>&1 || exit 0
          python3 scripts/pack.py . -o dist
          gh release upload "$tag" dist/workbuddy-skill-pack.zip --clobber
